<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
    <!-- Dark mode is a class on <html> (src/main.tsx keeps it in step with the system). Set it here,
         before the first paint, so a dark-mode device never flashes the light theme while the app loads. -->
    <script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");</script>
    <!-- Open the connection to the Convex deployment while the bundle is still downloading. -->
    <link rel="preconnect" href="%VITE_CONVEX_URL%" />
    <!-- Installed on a phone: full screen, our own title. The status bar is a solid strip in the
         theme colour above the page ("default"): with "black-translucent" the page ran under it and
         iOS 26 frosts that strip with a blur over whatever scrolls beneath, which looked broken. -->
    <meta name="application-name" content="UnSplit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UnSplit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="UnSplit: split shared expenses with friends, flatmates and travel groups. Free, no limits." />
    <title>UnSplit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
